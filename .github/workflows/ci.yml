# CI for VectorVault (see implementation-plan.md).
# The repo starts docs-only: each job detects whether its code exists yet and
# no-ops green until the corresponding PR lands (PR 1: infra/, PR 2: pyproject.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: detect
        run: echo "exists=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev deps
        if: steps.detect.outputs.exists == 'true'
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        if: steps.detect.outputs.exists == 'true'
        run: ruff check src tests

      - name: Unit tests (mocked boto3 — no AWS credentials)
        if: steps.detect.outputs.exists == 'true'
        run: pytest tests/unit -q

  infra:
    name: Infra (CDK synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect CDK project
        id: detect
        run: echo "exists=$([ -f infra/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install
        if: steps.detect.outputs.exists == 'true'
        working-directory: infra
        run: npm ci

      - name: Synth (no deploy, no AWS credentials)
        if: steps.detect.outputs.exists == 'true'
        working-directory: infra
        run: npx cdk synth --quiet

      - name: Verify template (one-way-door + least-privilege assertions)
        if: steps.detect.outputs.exists == 'true'
        working-directory: infra
        run: npm test
